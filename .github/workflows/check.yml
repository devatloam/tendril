name: Check

# Every push and pull request is checked on Linux, Windows and macOS. Nightly builds come from
# nightly.yml, which builds the newest commit on main that passed these checks; releases from
# release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@v2
      - if: runner.os == 'Linux'
        run: bun test scripts
