[package]
name = "tendril"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
description = "A fast keyboard launcher. Native, small, no web views."
license = "GPL-3.0-only"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "accessibility",
  "backend-winit",
  "renderer-winit-software",
  "renderer-femtovg",
  "software-renderer-systemfonts",
  "software-renderer-path",
  "image-default-formats",
  "unstable-winit-030",
] }
global-hotkey = "0.10"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
sha2 = "0.11"
serde_json = "1"
self-replace = "1.5"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# File search: ripgrep's walker, for .gitignore rules done properly. Its other parts (regex,
# walkdir) were already in the tree.
ignore = "0.4"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
# Update checks: rustls, trusting the system's certificates.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

# Update checks: the system's own TLS (SChannel, Apple's Security framework), and its certificates.
[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
icns = "0.5"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo build`: Tendril's own code still rebuilds in seconds, but its dependencies (Slint's
# renderer above all) are optimised once, so a local build draws and types about as fast as a release.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
