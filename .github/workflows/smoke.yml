name: Smoke

# Runs Tendril on a real Windows desktop and drives it like a person (scripts/smoke.ps1): first
# start, recording a shortcut, typing fast, clicking away, the shortcut, starting it again,
# clipboard history. Screenshots and a report go to the smoke-results branch, so they can be read
# without downloading anything: raw.githubusercontent.com/devatloam/tendril/smoke-results/smoke/report.txt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "ui/**", "Cargo.toml", "Cargo.lock", "scripts/smoke.ps1"]

concurrency:
  group: smoke
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    if: github.repository == 'devatloam/tendril'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Install it the way people will: through the installer, into their own folder.
      - name: Install
        shell: pwsh
        env:
          VERSION: 0.0.0-smoke
          TENDRIL_EXE: ${{ github.workspace }}\target\release\tendril.exe
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp packaging\tendril.iss
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          # Wait for the setup alone: -Wait also waits for anything it started, and Tendril keeps running.
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=login" -PassThru
          if (-not $p.WaitForExit(180000)) { "install: setup still running after 3 minutes" | Write-Host; $p.Kill() }
          Get-Process tendril -ErrorAction SilentlyContinue | Stop-Process
          $exe = "$env:LOCALAPPDATA\Programs\Tendril\tendril.exe"
          $menu = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tendril.lnk"
          $login = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue).Tendril
          $apps = Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{1B22A48F-20DA-4959-A9EB-F202B0B5A279}_is1"
          New-Item -ItemType Directory -Force smoke | Out-Null
          "install: exe there: $(Test-Path $exe); Start menu entry: $menu; starts at sign-in: '$login'; in Settings > Apps: $apps" | Set-Content smoke\install.txt
          Get-Content smoke\install.txt
      - name: Drive it
        shell: pwsh
        run: ./scripts/smoke.ps1 -Exe "$env:LOCALAPPDATA\Programs\Tendril\tendril.exe" -Out smoke
      - name: Keep the results
        if: always()
        shell: bash
        run: |
          cat smoke/report.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp -r smoke /tmp/results/
          git checkout --orphan smoke-results
          git rm -rf --quiet --cached .
          git clean -fdq -e target
          cp -r /tmp/results/smoke .
          echo "From $GITHUB_SHA, run $GITHUB_RUN_ID" > smoke/commit.txt
          git add smoke
          git commit -qm "Smoke test of $GITHUB_SHA"
          git push -f origin smoke-results
