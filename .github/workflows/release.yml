name: Release

# `bun run bump patch|minor|major --push` sets the version, commits, and pushes a tag like v0.2.0,
# which starts this. It builds every system (build.yml), writes the notes and publishes the
# release that Tendril's updater offers. Nightlies are published by check.yml instead.
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: The tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's $version. Use bun run bump."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Notes count from the previous release's tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          bun scripts/release.ts notes --tag "$GITHUB_REF_NAME" --ref "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --output notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "Tendril ${{ needs.verify.outputs.version }}" --notes-file notes.md
